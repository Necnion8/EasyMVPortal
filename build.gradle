import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id "com.gradleup.shadow" version "8.3.0"
}

group = 'com.gmail.necnionch.myplugin.easymvportal'
version = '1.1.2+1.21.11'

repositories {
    mavenCentral()

    // Spigot
    maven { url = uri('https://hub.spigotmc.org/nexus/content/groups/public/') }

    // AnvilGUI
    maven { url = uri("https://mvn.wesjd.net") }

    // Multiverse
    maven { url = uri("https://repo.onarandombox.com/content/groups/public/") }

    // WorldEdit
    maven { url = uri("https://maven.enginehub.org/repo/") }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.18-R0.1-SNAPSHOT'

    compileOnly "com.onarandombox.multiversecore:Multiverse-Core:4.2.0"
    compileOnly "com.onarandombox.multiverseportals:Multiverse-Portals:4.2.0"
    compileOnly "org.mvplugins.multiverse.core:multiverse-core:5.0.0"
    compileOnly "org.mvplugins.multiverse.portals:multiverse-portals:5.2.0"
    compileOnly "com.sk89q.worldedit:worldedit-core:7.1.0"

    implementation "net.wesjd:anvilgui:1.10.11-SNAPSHOT"
}

tasks.named("shadowJar", ShadowJar) {
    archiveClassifier.set("")
    exclude "/META-INF/**"
    relocate "net.wesjd.anvilgui", "${project.group}.libs.anvilgui"
}

def targetJavaVersion = 8
java {
    sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
    targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(targetJavaVersion)
    options.encoding = 'UTF-8'
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand(props)
    }
}